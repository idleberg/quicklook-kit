name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    # Same runner as the release workflow, XcodeGen from mise.toml needs macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # pnpm's default store on macOS.
      - uses: actions/cache@v6
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: jdx/mise-action@v2

      - run: pnpm run lint

      - run: pnpm run check
