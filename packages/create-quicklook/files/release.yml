name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # The folder holding quicklook.config.*, relative to the repository root.
  PROJECT: .

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v6
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: jdx/mise-action@v2

      # Builds every platform in quicklook.config; release builds for macOS are
      # universal (arm64 + x86_64) by default.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ${{ env.PROJECT }}
        env:
          VERSION: ${{ github.ref_name }}

      # <App>-<tag>-macos.zip and <App>-<tag>-windows.qlplugin, for whichever were built.
      - name: Package
        run: |
          mkdir release
          build="$PROJECT/.quicklook/build"
          for app in "$build"/macos/*.app; do
            [ -e "$app" ] || continue
            name=$(basename "$app" .app)
            (cd "$build/macos" && zip -r -9 -y "$GITHUB_WORKSPACE/release/${name// /-}-$GITHUB_REF_NAME-macos.zip" "$name.app")
          done
          for plugin in "$build"/windows/*.qlplugin; do
            [ -e "$plugin" ] || continue
            name=$(basename "$plugin" .qlplugin)
            cp "$plugin" "release/${name// /-}-$GITHUB_REF_NAME-windows.qlplugin"
          done
          cd release
          shasum -a 256 * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
