packages:
  - packages/*
  - packages/create-quicklook/templates/*

# Templates ask for quicklook-kit from npm; inside this repo they get the local copy instead.
linkWorkspacePackages: true

# All of these ship prebuilt binaries, their install scripts aren't needed.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@nsis/dent"

catalog:
  '@types/node': 24.19.2
  tsdown: 0.23.1
  typescript: 6.0.3
