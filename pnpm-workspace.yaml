packages:
  - packages/*
  - packages/create-quicklook/templates/*

# Templates ask for quicklook-kit from npm; inside this repo they get the local copy instead.
linkWorkspacePackages: true

# All of these ship prebuilt binaries, their install scripts aren't needed.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# astro2tsx forgets to declare @emnapi/runtime, so pnpm pairs its @emnapi/core@1.11.3 with an incompatible 2.x runtime.
packageExtensions:
  "@astrojs/astro2tsx@0.1.2":
    dependencies:
      "@emnapi/runtime": 1.11.3

minimumReleaseAgeExclude:
  - "@nsis/dent"
  - "@analogjs/vite-plugin-angular@3.0.0"

catalog:
  "@types/node": 26.6.6
  tsdown: 0.23.7
  typescript: 6.0.3
