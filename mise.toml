[tools]
node = "24"
hk = "latest"
pkl = "latest"
swiftlint = "latest"
xcodegen = "latest"

[settings]
# Node ships pnpm through corepack, pinned by packageManager in package.json
node.corepack = true

[env]
HK_MISE = 1
COREPACK_ENABLE_DOWNLOAD_PROMPT = 0
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = """
  hk install --mise
  pnpm install --frozen-lockfile
"""

[tasks.check]
description = "Typecheck the package, every template and the Swift sources"
depends = ["check:*"]

[tasks.'check:web']
description = "Typecheck the package and every template"
run = "pnpm --recursive check"

[tasks.'check:swift']
description = "Typecheck the Swift sources"
run = '''
xcrun swiftc -typecheck -parse-as-library -swift-version 6 packages/quicklook-kit/native/App/*.swift
xcrun swiftc -typecheck -parse-as-library -swift-version 6 packages/quicklook-kit/native/Extension/*.swift
'''

[tasks.lint]
description = "Lint JS/TS/Svelte/Astro and Swift sources"
run = ["pnpm exec biome lint .", "swiftlint lint --quiet"]

[tasks.format]
description = "Format all sources in place"
run = [
  "pnpm exec biome check --write .",
  "swift format --recursive --in-place packages/quicklook-kit/native",
]

[tasks.'format:check']
description = "Fail if any source is unformatted"
run = [
  "pnpm exec biome format .",
  "swift format lint --strict --recursive packages/quicklook-kit/native",
]
