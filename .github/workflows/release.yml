name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile

      # Release builds are universal (arm64 + x86_64) by default.
      - run: bun run build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package app
        id: package
        run: |
          name=$(jq -r .quicklook.name package.json)
          zip="${name// /-}-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r -9 -y "../$zip" "$name.app")
          shasum -a 256 "$zip" > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS
          generate_release_notes: true
